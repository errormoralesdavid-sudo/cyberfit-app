<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberFit App</title>
  <style>
    :root {
      --bg-color: #050b08;
      --card-bg: #0d1b13;
      --neon-green: #00ff66;
      --text-color: #e0eee8;
      --border-color: #1b3a27;
      --hover-color: #00cc52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--neon-green);
      padding: 15px;
      text-align: center;
    }

    h1 {
      color: var(--neon-green);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
    }

    .card-title {
      color: var(--neon-green);
      font-size: 1rem;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Frase Motivacional */
    .quote-box {
      font-style: italic;
      color: #a0c4b2;
      border-left: 3px solid var(--neon-green);
      padding-left: 10px;
    }

    /* Contador de Agua */
    .water-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .counter-btn {
      background: transparent;
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Formulario e Inps */
    .input-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #a0c4b2;
    }

    input, select {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 5px;
    }

    input:focus {
      outline: none;
      border-color: var(--neon-green);
    }

    .btn-action {
      width: 100%;
      background-color: var(--neon-green);
      color: var(--bg-color);
      border: none;
      padding: 12px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 10px;
    }

    /* Pestañas de Navegación */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.75rem;
      text-align: center;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--neon-green);
      font-weight: bold;
    }

    /* Lista Ejercicios */
    .exercise-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>CYBERFIT APP</h1>
  </header>

  <div class="container">
    
    <!-- PESTAÑA: INICIO -->
    <div id="tab-inicio" class="tab-content active">
      <div class="card">
        <div class="card-title">Cita Cyberpunk del Día</div>
        <p class="quote-box" id="daily-quote">"El sudor hoy es el rendimiento del mañana."</p>
      </div>

      <div class="card">
        <div class="card-title">Hidratación Diaria</div>
        <p>Vasos consumidos: <span id="water-count" style="color:var(--neon-green); font-weight:bold;">0</span> / 8</p>
        <div class="water-controls">
          <button class="counter-btn" onclick="updateWater(-1)">-</button>
          <button class="counter-btn" onclick="updateWater(1)">+ Tomar Agua</button>
        </div>
      </div>
    </div>

    <!-- PESTAÑA: RUTINAS -->
    <div id="tab-rutinas" class="tab-content">
      <div class="card">
        <div class="card-title">Rutina de Hoy</div>
        <div id="routine-list">
          <div class="exercise-item">
            <span>4x12 Press de Banca</span>
            <input type="checkbox" style="width:auto;">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Añadir / Editar Ejercicio</div>
        <div class="input-group">
          <label>Nombre del Ejercicio y Series</label>
          <input type="text" id="exercise-input" placeholder="Ej: 3x10 Sentadillas">
        </div>
        <button class="btn-action" onclick="addExercise()">Guardar Ejercicio</button>
      </div>
    </div>

    <!-- PESTAÑA: DESCANSO -->
    <div id="tab-descanso" class="tab-content">
      <div class="card" style="text-align:center;">
        <div class="card-title">Temporizador de Descanso</div>
        <h2 id="timer-display" style="font-size:2.5rem; color:var(--neon-green); margin:15px 0;">01:30</h2>
        <button class="btn-action" onclick="startTimer(90)">Iniciar 90s</button>
        <button class="btn-action" style="background:transparent; border:1px solid var(--neon-green); color:var(--neon-green);" onclick="startTimer(60)">Iniciar 60s</button>
      </div>
    </div>

    <!-- PESTAÑA: REGISTRO -->
    <div id="tab-registro" class="tab-content">
      <div class="card">
        <div class="card-title">Registro Corporal</div>
        <div class="input-group"><label>Peso Actual (kg)</label><input type="number" step="0.1" placeholder="Ej. 78.5"></div>
        <div class="input-group"><label>Altura (cm)</label><input type="number" placeholder="Ej. 175"></div>
        <div class="input-group"><label>Medida de Brazos (cm)</label><input type="number" step="0.1"></div>
        <div class="input-group"><label>Medida de Piernas (cm)</label><input type="number" step="0.1"></div>
        <div class="input-group"><label>Medida de Cintura (cm)</label><input type="number" step="0.1"></div>
        <button class="btn-action">Guardar Métricas</button>
      </div>
    </div>

  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="nav-bar">
    <div class="nav-item active" onclick="switchTab('inicio', this)">Inicio</div>
    <div class="nav-item" onclick="switchTab('rutinas', this)">Rutinas</div>
    <div class="nav-item" onclick="switchTab('descanso', this)">Descanso</div>
    <div class="nav-item" onclick="switchTab('registro', this)">Registro</div>
  </nav>

  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      element.classList.add('active');
    }

    let waterCount = 0;
    function updateWater(val) {
      waterCount = Math.max(0, waterCount + val);
      document.getElementById('water-count').innerText = waterCount;
    }

    function addExercise() {
      const input = document.getElementById('exercise-input');
      if (input.value.trim() !== '') {
        const list = document.getElementById('routine-list');
        const item = document.createElement('div');
        item.className = 'exercise-item';
        item.innerHTML = `<span>${input.value}</span><input type="checkbox" style="width:auto;">`;
        list.appendChild(item);
        input.value = '';
      }
    }

    let timerInterval;
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let time = seconds;
      const display = document.getElementById('timer-display');
      timerInterval = setInterval(() => {
        const mins = String(Math.floor(time / 60)).padStart(2, '0');
        const secs = String(time % 60).padStart(2, '0');
        display.innerText = `${mins}:${secs}`;
        if (--time < 0) {
          clearInterval(timerInterval);
          alert('¡Tiempo de descanso finalizado!');
        }
      }, 1000);
    }
  </script>
</body>
</html>
